<svg xmlns="http://www.w3.org/2000/svg" width="180" height="50" viewBox="0 0 180 50">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
  </defs>

  <!-- Outer halo glow (behind background) -->
  <rect x="3" y="3" width="174" height="44" rx="22"
        fill="none" stroke="#00b4ff" stroke-width="5"
        stroke-dasharray="60 338" stroke-linecap="round"
        filter="url(#halo)">
    <animate attributeName="stroke-dashoffset" values="0;-398" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Dark background -->
  <rect x="3" y="3" width="174" height="44" rx="22" fill="url(#bg)"/>

  <!-- Subtle static border -->
  <rect x="3" y="3" width="174" height="44" rx="22"
        fill="none" stroke="#0077B5" stroke-width="0.6" opacity="0.25"/>

  <!-- Primary animated glow border -->
  <rect x="3" y="3" width="174" height="44" rx="22"
        fill="none" stroke="#00b4ff" stroke-width="2.5"
        stroke-dasharray="50 348" stroke-linecap="round"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-398" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Secondary glow trail (offset, dimmer) -->
  <rect x="3" y="3" width="174" height="44" rx="22"
        fill="none" stroke="#0077B5" stroke-width="1.5"
        stroke-dasharray="25 373" stroke-linecap="round"
        opacity="0.4" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="-199;199" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- LinkedIn "in" icon box -->
  <rect x="22" y="14" width="22" height="22" rx="4" fill="#0077B5"/>
  <text x="33" y="31.5" text-anchor="middle" fill="white"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="15">in</text>

  <!-- Label -->
  <text x="112" y="31" text-anchor="middle" fill="white"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="13" letter-spacing="2.5">LINKEDIN</text>
</svg>
