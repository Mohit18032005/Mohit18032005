<svg xmlns="http://www.w3.org/2000/svg" width="195" height="50" viewBox="0 0 195 50">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
  </defs>

  <!-- Outer halo glow -->
  <rect x="3" y="3" width="189" height="44" rx="22"
        fill="none" stroke="#c084fc" stroke-width="5"
        stroke-dasharray="60 358" stroke-linecap="round"
        filter="url(#halo)">
    <animate attributeName="stroke-dashoffset" values="0;-418" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Dark background -->
  <rect x="3" y="3" width="189" height="44" rx="22" fill="url(#bg)"/>

  <!-- Subtle static border -->
  <rect x="3" y="3" width="189" height="44" rx="22"
        fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.25"/>

  <!-- Primary animated glow border -->
  <rect x="3" y="3" width="189" height="44" rx="22"
        fill="none" stroke="#c084fc" stroke-width="2.5"
        stroke-dasharray="50 368" stroke-linecap="round"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-418" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Secondary glow trail -->
  <rect x="3" y="3" width="189" height="44" rx="22"
        fill="none" stroke="#a855f7" stroke-width="1.5"
        stroke-dasharray="25 393" stroke-linecap="round"
        opacity="0.4" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="-209;209" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Globe icon -->
  <circle cx="33" cy="25" r="10" fill="none" stroke="white" stroke-width="1.6"/>
  <ellipse cx="33" cy="25" rx="5.5" ry="10" fill="none" stroke="white" stroke-width="1.2"/>
  <line x1="23" y1="25" x2="43" y2="25" stroke="white" stroke-width="1.2"/>

  <!-- Label -->
  <text x="122" y="31" text-anchor="middle" fill="white"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="13" letter-spacing="2.5">PORTFOLIO</text>
</svg>
