<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#0a0015;#0f0c29;#150030;#0a0015" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%">
        <animate attributeName="stop-color" values="#1a0533;#302b63;#2d1b69;#1a0533" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#0d0b1a;#24243e;#1a1a3e;#0d0b1a" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Center radial glow -->
    <radialGradient id="cg" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-opacity" values="0.1;0.28;0.1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Scan line gradient -->
    <linearGradient id="sl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong title glow -->
    <filter id="tg" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"  result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip"><rect width="900" height="280"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#cg)"/>

    <!-- Subtle grid -->
    <g stroke="#a855f7" stroke-width="0.3" opacity="0.07">
      <line x1="0"   y1="35"  x2="900" y2="35"/>
      <line x1="0"   y1="70"  x2="900" y2="70"/>
      <line x1="0"   y1="105" x2="900" y2="105"/>
      <line x1="0"   y1="140" x2="900" y2="140"/>
      <line x1="0"   y1="175" x2="900" y2="175"/>
      <line x1="0"   y1="210" x2="900" y2="210"/>
      <line x1="0"   y1="245" x2="900" y2="245"/>
      <line x1="45"  y1="0"   x2="45"  y2="280"/>
      <line x1="90"  y1="0"   x2="90"  y2="280"/>
      <line x1="135" y1="0"   x2="135" y2="280"/>
      <line x1="180" y1="0"   x2="180" y2="280"/>
      <line x1="225" y1="0"   x2="225" y2="280"/>
      <line x1="270" y1="0"   x2="270" y2="280"/>
      <line x1="630" y1="0"   x2="630" y2="280"/>
      <line x1="675" y1="0"   x2="675" y2="280"/>
      <line x1="720" y1="0"   x2="720" y2="280"/>
      <line x1="765" y1="0"   x2="765" y2="280"/>
      <line x1="810" y1="0"   x2="810" y2="280"/>
      <line x1="855" y1="0"   x2="855" y2="280"/>
    </g>

    <!-- ═══ MATRIX RAIN ═══ -->
    <!-- Column 1 -->
    <g opacity="0.28" fill="#a855f7" font-family="monospace" font-size="11">
      <animateTransform attributeName="transform" type="translate" from="0,-220" to="0,280" dur="3.8s" repeatCount="indefinite" begin="0s"/>
      <text x="18" y="0">1</text><text x="18" y="14">0</text><text x="18" y="28">A</text><text x="18" y="42">1</text><text x="18" y="56">F</text><text x="18" y="70">0</text><text x="18" y="84">B</text><text x="18" y="98">1</text><text x="18" y="112">0</text><text x="18" y="126">C</text><text x="18" y="140">1</text><text x="18" y="154">D</text><text x="18" y="168">0</text><text x="18" y="182">E</text><text x="18" y="196">1</text><text x="18" y="210">0</text>
    </g>
    <!-- Column 2 -->
    <g opacity="0.22" fill="#c084fc" font-family="monospace" font-size="11">
      <animateTransform attributeName="transform" type="translate" from="0,-220" to="0,280" dur="4.3s" repeatCount="indefinite" begin="0.9s"/>
      <text x="50" y="0">A</text><text x="50" y="14">B</text><text x="50" y="28">0</text><text x="50" y="42">1</text><text x="50" y="56">C</text><text x="50" y="70">D</text><text x="50" y="84">1</text><text x="50" y="98">0</text><text x="50" y="112">E</text><text x="50" y="126">F</text><text x="50" y="140">0</text><text x="50" y="154">1</text><text x="50" y="168">A</text><text x="50" y="182">0</text><text x="50" y="196">C</text><text x="50" y="210">1</text>
    </g>
    <!-- Column 3 -->
    <g opacity="0.18" fill="#a855f7" font-family="monospace" font-size="10">
      <animateTransform attributeName="transform" type="translate" from="0,-220" to="0,280" dur="5.1s" repeatCount="indefinite" begin="1.6s"/>
      <text x="130" y="0">1</text><text x="130" y="13">0</text><text x="130" y="26">F</text><text x="130" y="39">A</text><text x="130" y="52">1</text><text x="130" y="65">B</text><text x="130" y="78">0</text><text x="130" y="91">C</text><text x="130" y="104">1</text><text x="130" y="117">0</text><text x="130" y="130">D</text><text x="130" y="143">E</text><text x="130" y="156">1</text><text x="130" y="169">0</text><text x="130" y="182">F</text><text x="130" y="195">A</text>
    </g>
    <!-- Column 4 (right) -->
    <g opacity="0.28" fill="#a855f7" font-family="monospace" font-size="11">
      <animateTransform attributeName="transform" type="translate" from="0,-220" to="0,280" dur="4.6s" repeatCount="indefinite" begin="0.4s"/>
      <text x="832" y="0">D</text><text x="832" y="14">1</text><text x="832" y="28">0</text><text x="832" y="42">E</text><text x="832" y="56">F</text><text x="832" y="70">1</text><text x="832" y="84">0</text><text x="832" y="98">A</text><text x="832" y="112">B</text><text x="832" y="126">1</text><text x="832" y="140">0</text><text x="832" y="154">C</text><text x="832" y="168">1</text><text x="832" y="182">D</text><text x="832" y="196">0</text><text x="832" y="210">1</text>
    </g>
    <!-- Column 5 (right) -->
    <g opacity="0.22" fill="#c084fc" font-family="monospace" font-size="11">
      <animateTransform attributeName="transform" type="translate" from="0,-220" to="0,280" dur="3.4s" repeatCount="indefinite" begin="2.1s"/>
      <text x="860" y="0">C</text><text x="860" y="14">0</text><text x="860" y="28">1</text><text x="860" y="42">B</text><text x="860" y="56">A</text><text x="860" y="70">0</text><text x="860" y="84">1</text><text x="860" y="98">F</text><text x="860" y="112">E</text><text x="860" y="126">0</text><text x="860" y="140">D</text><text x="860" y="154">1</text><text x="860" y="168">0</text><text x="860" y="182">C</text><text x="860" y="196">B</text><text x="860" y="210">1</text>
    </g>
    <!-- Column 6 (right subtle) -->
    <g opacity="0.14" fill="#a855f7" font-family="monospace" font-size="10">
      <animateTransform attributeName="transform" type="translate" from="0,-220" to="0,280" dur="4.9s" repeatCount="indefinite" begin="2.8s"/>
      <text x="770" y="0">0</text><text x="770" y="13">F</text><text x="770" y="26">1</text><text x="770" y="39">E</text><text x="770" y="52">0</text><text x="770" y="65">D</text><text x="770" y="78">1</text><text x="770" y="91">C</text><text x="770" y="104">0</text><text x="770" y="117">B</text><text x="770" y="130">A</text><text x="770" y="143">0</text><text x="770" y="156">1</text><text x="770" y="169">F</text><text x="770" y="182">E</text><text x="770" y="195">0</text>
    </g>

    <!-- ═══ NEURAL NETWORK LEFT ═══ -->
    <g filter="url(#glow)">
      <circle cx="105" cy="68" r="3" fill="#a855f7">
        <animate attributeName="r"       values="2;4.5;2"  dur="2.5s" repeatCount="indefinite" begin="0s"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0s"/>
      </circle>
      <circle cx="158" cy="128" r="3" fill="#c084fc">
        <animate attributeName="r"       values="2;4.5;2"  dur="3.1s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="105" cy="198" r="3" fill="#a855f7">
        <animate attributeName="r"       values="2;4.5;2"  dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <circle cx="195" cy="140" r="5.5" fill="#a855f7">
        <animate attributeName="r"       values="4;7.5;4"  dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="245" cy="90" r="2.5" fill="#c084fc">
        <animate attributeName="r"       values="1.5;3.5;1.5" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <circle cx="245" cy="195" r="2.5" fill="#c084fc">
        <animate attributeName="r"       values="1.5;3.5;1.5" dur="2.7s" repeatCount="indefinite" begin="1.5s"/>
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.7s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
    </g>
    <g stroke="#a855f7" stroke-width="0.8" fill="none">
      <line x1="105" y1="68"  x2="158" y2="128"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite" begin="0s"/></line>
      <line x1="158" y1="128" x2="105" y2="198"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.1s" repeatCount="indefinite" begin="0.4s"/></line>
      <line x1="105" y1="68"  x2="195" y2="140"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="2.8s" repeatCount="indefinite" begin="0.2s"/></line>
      <line x1="158" y1="128" x2="195" y2="140"><animate attributeName="opacity" values="0.1;0.4;0.1"  dur="3s"   repeatCount="indefinite" begin="0.7s"/></line>
      <line x1="105" y1="198" x2="195" y2="140"><animate attributeName="opacity" values="0.1;0.38;0.1" dur="2.5s" repeatCount="indefinite" begin="1.1s"/></line>
      <line x1="195" y1="140" x2="245" y2="90" ><animate attributeName="opacity" values="0.1;0.35;0.1" dur="2.2s" repeatCount="indefinite" begin="0.8s"/></line>
      <line x1="195" y1="140" x2="245" y2="195"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="2.7s" repeatCount="indefinite" begin="1.5s"/></line>
    </g>

    <!-- ═══ NEURAL NETWORK RIGHT (mirror) ═══ -->
    <g filter="url(#glow)">
      <circle cx="795" cy="68" r="3" fill="#a855f7">
        <animate attributeName="r"       values="2;4.5;2"  dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="742" cy="128" r="3" fill="#c084fc">
        <animate attributeName="r"       values="2;4.5;2"  dur="3.3s" repeatCount="indefinite" begin="0.9s"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <circle cx="795" cy="198" r="3" fill="#a855f7">
        <animate attributeName="r"       values="2;4.5;2"  dur="2.6s" repeatCount="indefinite" begin="1.4s"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite" begin="1.4s"/>
      </circle>
      <circle cx="705" cy="140" r="5.5" fill="#a855f7">
        <animate attributeName="r"       values="4;7.5;4"  dur="3s"   repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s"   repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="655" cy="90" r="2.5" fill="#c084fc">
        <animate attributeName="r"       values="1.5;3.5;1.5" dur="2.4s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="655" cy="195" r="2.5" fill="#c084fc">
        <animate attributeName="r"       values="1.5;3.5;1.5" dur="2.9s" repeatCount="indefinite" begin="1.7s"/>
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.9s" repeatCount="indefinite" begin="1.7s"/>
      </circle>
    </g>
    <g stroke="#a855f7" stroke-width="0.8" fill="none">
      <line x1="795" y1="68"  x2="742" y2="128"><animate attributeName="opacity" values="0.1;0.5;0.1"  dur="2.8s" repeatCount="indefinite" begin="0.3s"/></line>
      <line x1="742" y1="128" x2="795" y2="198"><animate attributeName="opacity" values="0.1;0.4;0.1"  dur="3.3s" repeatCount="indefinite" begin="0.7s"/></line>
      <line x1="795" y1="68"  x2="705" y2="140"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="2.6s" repeatCount="indefinite" begin="0.5s"/></line>
      <line x1="742" y1="128" x2="705" y2="140"><animate attributeName="opacity" values="0.1;0.4;0.1"  dur="3s"   repeatCount="indefinite" begin="1.1s"/></line>
      <line x1="795" y1="198" x2="705" y2="140"><animate attributeName="opacity" values="0.1;0.38;0.1" dur="2.8s" repeatCount="indefinite" begin="1.4s"/></line>
      <line x1="705" y1="140" x2="655" y2="90" ><animate attributeName="opacity" values="0.1;0.35;0.1" dur="2.4s" repeatCount="indefinite" begin="1s"/></line>
      <line x1="705" y1="140" x2="655" y2="195"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="2.9s" repeatCount="indefinite" begin="1.7s"/></line>
    </g>

    <!-- ═══ SCANNING LINE ═══ -->
    <rect x="0" y="0" width="900" height="2" fill="url(#sl)">
      <animate attributeName="y"       values="0;280;0"       dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- ═══ CORNER BRACKETS ═══ -->
    <g stroke="#a855f7" stroke-width="1.8" fill="none">
      <path d="M12,32 L12,10 L34,10">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="0s"/>
      </path>
      <path d="M888,32 L888,10 L866,10">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1s"/>
      </path>
      <path d="M12,248 L12,270 L34,270">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </path>
      <path d="M888,248 L888,270 L866,270">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </path>
    </g>

    <!-- ═══ GLOWING ELLIPSE RING BEHIND TITLE ═══ -->
    <ellipse cx="450" cy="132" rx="195" ry="65" fill="none" stroke="#a855f7" stroke-width="0.6">
      <animate attributeName="rx"      values="185;205;185" dur="5s"   repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ═══ MAIN TITLE ═══ -->
    <text x="450" y="120" text-anchor="middle"
      font-family="'Courier New', Courier, monospace"
      font-size="46" font-weight="bold"
      fill="white" filter="url(#tg)" letter-spacing="2">
      <animate attributeName="opacity" values="0.88;1;0.88" dur="4s" repeatCount="indefinite"/>
      MD Mohit Khan
    </text>

    <!-- Animated underline -->
    <rect x="350" y="130" width="200" height="1.5" fill="#a855f7" rx="1">
      <animate attributeName="width" values="140;200;140" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x"     values="380;350;380" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5"  dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- ═══ SUBTITLE ═══ -->
    <text x="450" y="160" text-anchor="middle"
      font-family="'Courier New', Courier, monospace"
      font-size="13" fill="#a855f7" filter="url(#glow)" letter-spacing="5">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      AI · ML · IoT · BUILDER
    </text>

    <!-- Blinking cursor -->
    <rect x="624" y="147" width="9" height="2" fill="#a855f7" rx="1">
      <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"/>
    </rect>

    <!-- Institute text -->
    <text x="450" y="202" text-anchor="middle"
      font-family="monospace" font-size="10" fill="#4a3570" letter-spacing="2.5">
      IEM KOLKATA  ·  B.TECH CSE (AI)  ·  2ND YEAR
    </text>

    <!-- Decorative pulsing dots -->
    <g fill="#a855f7" filter="url(#glow)">
      <circle cx="258" cy="202" r="1.8">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" begin="0s"/>
      </circle>
      <circle cx="278" cy="202" r="1.8">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="298" cy="202" r="1.8">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="602" cy="202" r="1.8">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <circle cx="622" cy="202" r="1.8">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <circle cx="642" cy="202" r="1.8">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
    </g>

    <!-- Outer border glow -->
    <rect x="0.5" y="0.5" width="899" height="279" fill="none" stroke="#a855f7" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
