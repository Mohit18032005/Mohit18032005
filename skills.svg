        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1.75s"/>
      </rect>
      <circle cx="177" cy="178" r="9" fill="#76B900">
        <animate attributeName="r" values="7.5;9.5;7.5" dur="3s" repeatCount="indefinite" begin="1.75s"/>
