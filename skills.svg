<svg width="850" height="340" viewBox="0 0 850 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lg" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="850" height="340"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="850" height="340" fill="#080b10"/>

    <!-- Subtle bg dots grid -->
    <g fill="#a855f7" opacity="0.03">
      <circle cx="60"  cy="60"  r="1.5"/><circle cx="120" cy="60"  r="1.5"/><circle cx="180" cy="60"  r="1.5"/><circle cx="240" cy="60"  r="1.5"/><circle cx="300" cy="60"  r="1.5"/><circle cx="360" cy="60"  r="1.5"/><circle cx="420" cy="60"  r="1.5"/><circle cx="480" cy="60"  r="1.5"/><circle cx="540" cy="60"  r="1.5"/><circle cx="600" cy="60"  r="1.5"/><circle cx="660" cy="60"  r="1.5"/><circle cx="720" cy="60"  r="1.5"/><circle cx="780" cy="60"  r="1.5"/>
      <circle cx="60"  cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="180" cy="120" r="1.5"/><circle cx="240" cy="120" r="1.5"/><circle cx="300" cy="120" r="1.5"/><circle cx="360" cy="120" r="1.5"/><circle cx="420" cy="120" r="1.5"/><circle cx="480" cy="120" r="1.5"/><circle cx="540" cy="120" r="1.5"/><circle cx="600" cy="120" r="1.5"/><circle cx="660" cy="120" r="1.5"/><circle cx="720" cy="120" r="1.5"/><circle cx="780" cy="120" r="1.5"/>
      <circle cx="60"  cy="180" r="1.5"/><circle cx="120" cy="180" r="1.5"/><circle cx="180" cy="180" r="1.5"/><circle cx="240" cy="180" r="1.5"/><circle cx="300" cy="180" r="1.5"/><circle cx="360" cy="180" r="1.5"/><circle cx="420" cy="180" r="1.5"/><circle cx="480" cy="180" r="1.5"/><circle cx="540" cy="180" r="1.5"/><circle cx="600" cy="180" r="1.5"/><circle cx="660" cy="180" r="1.5"/><circle cx="720" cy="180" r="1.5"/><circle cx="780" cy="180" r="1.5"/>
      <circle cx="60"  cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/><circle cx="180" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="300" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/><circle cx="420" cy="240" r="1.5"/><circle cx="480" cy="240" r="1.5"/><circle cx="540" cy="240" r="1.5"/><circle cx="600" cy="240" r="1.5"/><circle cx="660" cy="240" r="1.5"/><circle cx="720" cy="240" r="1.5"/><circle cx="780" cy="240" r="1.5"/>
