    <circle cx="18"  cy="18" r="6" fill="#ff5f57" opacity="0.85"/>
    <circle cx="36"  cy="18" r="6" fill="#febc2e" opacity="0.85"/>
    <circle cx="54"  cy="18" r="6" fill="#28c840" opacity="0.85"/>
    <text x="72" y="23" fill="#a855f7" font-family="monospace" font-size="12" letter-spacing="2">$ cat stack.json</text>
    <text x="780" y="23" fill="#334" font-family="monospace" font-size="11">v2026</text>
    <line x1="0" y1="36" x2="850" y2="36" stroke="#1a1040" stroke-width="1"/>

    <!-- Scanning sweep line -->
    <rect x="0" y="36" width="850" height="1.5" fill="url(#scanGrad)">
      <animate attributeName="y" values="36;310;36" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.95;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- ═══════════════ ROW 1: LANGUAGES (label y=52, pills y=62) ═══════════════ -->
    <text x="10" y="52" fill="#4ade80" font-family="monospace" font-size="11" letter-spacing="1.5" filter="url(#lg)">› LANGUAGES</text>

    <!-- Python pill -->
    <g filter="url(#glow)">
      <rect x="8" y="60" width="100" height="28" rx="14" fill="#07142b" stroke="#3776AB" stroke-width="1.3">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="0s"/>
      </rect>
      <circle cx="22" cy="74" r="9" fill="#3776AB">
        <animate attributeName="r" values="7.5;9.5;7.5" dur="3s" repeatCount="indefinite" begin="0s"/>
      </circle>
    </g>
    <text x="37" y="79" fill="#e2e8f0" font-family="monospace" font-size="12.5">Python</text>

    <!-- C pill -->
