      <circle cx="22" cy="282" r="9" fill="#FF6384">
        <animate attributeName="r" values="7.5;9.5;7.5" dur="3s" repeatCount="indefinite" begin="2.5s"/>
      </circle>
    </g>
    <text x="37" y="287" fill="#e2e8f0" font-family="monospace" font-size="12.5">Data Analytics</text>

    <!-- Cybersecurity -->
    <g filter="url(#glow)">
