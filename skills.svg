      <rect x="118" y="60" width="58" height="28" rx="14" fill="#07142b" stroke="#00599C" stroke-width="1.3">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="0.25s"/>
      </rect>
      <circle cx="132" cy="74" r="9" fill="#00599C">
