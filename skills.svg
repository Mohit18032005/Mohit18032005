    <line x1="0" y1="312" x2="850" y2="312" stroke="#1a1040" stroke-width="1"/>
    <text x="425" y="328" text-anchor="middle" fill="#2a1a50" font-family="monospace" font-size="10" letter-spacing="3">KOLKATA · INDIA · B.TECH CSE (AI) · 2026</text>

    <!-- ═══════════════ CORNER BRACKETS ═══════════════ -->
    <g stroke="#a855f7" stroke-width="1.6" fill="none">
      <path d="M8,20 L8,8 L20,8">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite" begin="0s"/>
      </path>
      <path d="M842,20 L842,8 L830,8">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite" begin="1s"/>
      </path>
      <path d="M8,320 L8,332 L20,332">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </path>
      <path d="M842,320 L842,332 L830,332">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </path>
    </g>

    <!-- Outer border pulse -->
    <rect x="0.5" y="0.5" width="849" height="339" fill="none" stroke="#a855f7" stroke-width="0.8">
