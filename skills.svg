        <animate attributeName="stroke-opacity" values="0.25;0.85;0.25" dur="2s" repeatCount="indefinite" begin="2.75s"/>
      </rect>
      <circle cx="190" cy="282" r="9" fill="#00cc44">
        <animate attributeName="r" values="7.5;9.5;7.5" dur="2s" repeatCount="indefinite" begin="2.75s"/>
