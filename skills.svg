        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="2.25s"/>
      </rect>
      <circle cx="145" cy="230" r="9" fill="#4285F4">
        <animate attributeName="r" values="7.5;9.5;7.5" dur="3s" repeatCount="indefinite" begin="2.25s"/>
      </circle>
