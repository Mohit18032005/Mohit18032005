<svg width="850" height="340" viewBox="0 0 850 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Ocean & Midnight Sky -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#070e1b"/>
      <stop offset="45%"  stop-color="#0b172a"/>
      <stop offset="85%"  stop-color="#091f36"/>
      <stop offset="100%" stop-color="#040c17"/>
    </linearGradient>

    <!-- Gold Treasure Glow -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Conqueror's Haki Red/Purple Aura Filter -->
    <filter id="hakiGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text Glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip Path -->
    <clipPath id="boardClip"><rect width="850" height="340" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#boardClip)">
    <!-- Deep Ocean Background -->
    <rect width="850" height="340" fill="url(#oceanBg)"/>

    <!-- === ANIMATED OCEAN WAVES (Background Effect) === -->
    <path d="M0,100 Q212,120 425,100 Q637,80 850,100 L850,340 L0,340 Z" fill="#00b4d8" opacity="0.03">
      <animate attributeName="d" values="
        M0,100 Q212,120 425,100 Q637,80 850,100 L850,340 L0,340 Z;
        M0,110 Q212,90 425,110 Q637,130 850,110 L850,340 L0,340 Z;
        M0,100 Q212,120 425,100 Q637,80 850,100 L850,340 L0,340 Z"
        dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0,200 Q212,180 425,200 Q637,220 850,200 L850,340 L0,340 Z" fill="#90e0ef" opacity="0.02">
      <animate attributeName="d" values="
        M0,200 Q212,180 425,200 Q637,220 850,200 L850,340 L0,340 Z;
        M0,190 Q212,210 425,190 Q637,170 850,190 L850,340 L0,340 Z;
        M0,200 Q212,180 425,200 Q637,220 850,200 L850,340 L0,340 Z"
        dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- === DRIFTING SAKURA PETALS (Wano Arc Vibe) === -->
    <g fill="#ffb7c5" opacity="0.65" filter="url(#textGlow)">
      <!-- Petal 1 -->
      <path d="M0,0 C-3,-6 3,-10 6,-4 C9,2 2,6 0,0 Z">
        <animateTransform attributeName="transform" type="translate" values="100,-10; 180,350" dur="9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="9s" repeatCount="indefinite" additive="sum"/>
      </path>
      <!-- Petal 2 -->
      <path d="M0,0 C-3,-6 3,-10 6,-4 C9,2 2,6 0,0 Z">
        <animateTransform attributeName="transform" type="translate" values="350,-10; 420,350" dur="11s" repeatCount="indefinite" begin="2s"/>
        <animateTransform attributeName="transform" type="rotate" values="45; 405" dur="11s" repeatCount="indefinite" additive="sum"/>
      </path>
      <!-- Petal 3 -->
      <path d="M0,0 C-3,-6 3,-10 6,-4 C9,2 2,6 0,0 Z">
        <animateTransform attributeName="transform" type="translate" values="600,-10; 680,350" dur="10s" repeatCount="indefinite" begin="4s"/>
        <animateTransform attributeName="transform" type="rotate" values="90; 450" dur="10s" repeatCount="indefinite" additive="sum"/>
      </path>
      <!-- Petal 4 -->
      <path d="M0,0 C-3,-6 3,-10 6,-4 C9,2 2,6 0,0 Z">
        <animateTransform attributeName="transform" type="translate" values="780,-10; 810,350" dur="8s" repeatCount="indefinite" begin="1s"/>
        <animateTransform attributeName="transform" type="rotate" values="120; 480" dur="8s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>

    <!-- === ONE PIECE STRAW HAT PIRATES HEADER BAR === -->
    <rect width="850" height="38" fill="#0c1626" opacity="0.95"/>

    <!-- Straw Hat Yellow & Red Ribbon Accent line -->
    <line x1="0" y1="37" x2="850" y2="37" stroke="#ffb703" stroke-width="2"/>
    <line x1="0" y1="38" x2="850" y2="38" stroke="#d90429" stroke-width="1.5"/>

    <!-- STRAW HAT SKULL (Jolly Roger Icon) -->
    <g transform="translate(14, 8)">
      <!-- Straw Hat Top -->
      <path d="M4,13 Q11,4 18,13 Z" fill="#ffb703"/>
      <!-- Straw Hat Brim -->
      <ellipse cx="11" cy="14" rx="10" ry="2.5" fill="#ffb703"/>
      <!-- Red Band -->
      <path d="M5,12.5 Q11,10 17,12.5" stroke="#d90429" stroke-width="2" fill="none"/>
      <!-- Skull Head -->
      <circle cx="11" cy="17" r="4.5" fill="#ffffff"/>
      <!-- Eye Sockets -->
      <circle cx="9.5" cy="16.5" r="1" fill="#000"/>
      <circle cx="12.5" cy="16.5" r="1" fill="#000"/>
      <!-- Crossbones behind -->
      <line x1="2" y1="10" x2="20" y2="22" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="20" y1="10" x2="2" y2="22" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <text x="42" y="24" fill="#ffb703" font-family="'Courier New', monospace" font-weight="bold" font-size="13" letter-spacing="1.5" filter="url(#textGlow)">
      🏴‍☠️ GRAND LINE TECH ARSENAL // stack.json
    </text>

    <!-- Bounty / Wanted Label in Header -->
    <g transform="translate(730, 8)">
      <rect width="105" height="22" rx="4" fill="#d90429" opacity="0.85"/>
      <text x="52.5" y="15" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">
        ฿ 3,000,000,000
      </text>
    </g>

    <!-- === CONQUEROR'S HAKI SCANNING SWEEP === -->
    <line x1="0" y1="40" x2="850" y2="40" stroke="#d90429" stroke-width="2" opacity="0" filter="url(#hakiGlow)">
      <animate attributeName="y1" values="40;310;40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="40;310;40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- ═══════════════ ROW 1: COMBAT LANGUAGES (y=50, pills y=60) ═══════════════ -->
    <text x="12" y="52" fill="#ffb703" font-family="'Courier New', monospace" font-weight="bold" font-size="11" letter-spacing="2" filter="url(#textGlow)">
      ⚔️ COMBAT LANGUAGES
    </text>

    <!-- Python (Blue Flame / Luffy Gear 3 theme) -->
    <g filter="url(#goldGlow)">
      <rect x="10" y="60" width="102" height="28" rx="14" fill="#091a30" stroke="#38bdf8" stroke-width="1.5">
        <animate attributeName="stroke" values="#38bdf8;#ffb703;#38bdf8" dur="4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="24" cy="74" r="8" fill="#38bdf8">
        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="79" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Python</text>
    </g>

    <!-- C -->
    <g filter="url(#goldGlow)">
      <rect x="120" y="60" width="60" height="28" rx="14" fill="#091a30" stroke="#0284c7" stroke-width="1.5">
        <animate attributeName="stroke" values="#0284c7;#ffb703;#0284c7" dur="4s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <circle cx="134" cy="74" r="8" fill="#0284c7">
        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <text x="150" y="79" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">C</text>
    </g>

    <!-- Java (Mera Mera no Mi Flame) -->
    <g filter="url(#goldGlow)">
      <rect x="188" y="60" width="86" height="28" rx="14" fill="#1c0900" stroke="#f97316" stroke-width="1.5">
        <animate attributeName="stroke" values="#f97316;#d90429;#f97316" dur="3s" repeatCount="indefinite"/>
      </rect>
      <circle cx="202" cy="74" r="8" fill="#f97316">
        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <text x="218" y="79" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Java</text>
    </g>

    <!-- ═══════════════ ROW 2: DEVIL FRUIT POWERS (y=104, pills y=112) ═══════════════ -->
    <text x="12" y="104" fill="#a855f7" font-family="'Courier New', monospace" font-weight="bold" font-size="11" letter-spacing="2" filter="url(#textGlow)">
      🍇 DEVIL FRUIT POWERS (AI / ML)
    </text>

    <!-- TensorFlow (Magma Fruit Akainu / Sun God Nika Flame) -->
    <g filter="url(#hakiGlow)">
      <rect x="10" y="112" width="130" height="28" rx="14" fill="#200500" stroke="#ef4444" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <circle cx="24" cy="126" r="8" fill="#ef4444">
        <animate attributeName="r" values="7;9.5;7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="131" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">TensorFlow</text>
    </g>

    <!-- scikit-learn (Ope Ope no Mi Law Aura) -->
    <g filter="url(#goldGlow)">
      <rect x="148" y="112" width="145" height="28" rx="14" fill="#1b0f00" stroke="#f59e0b" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.4s"/>
      </rect>
      <circle cx="162" cy="126" r="8" fill="#f59e0b">
        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
      <text x="178" y="131" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">scikit-learn</text>
    </g>

    <!-- IBM Granite -->
    <g filter="url(#goldGlow)">
      <rect x="301" y="112" width="138" height="28" rx="14" fill="#04122c" stroke="#3b82f6" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.8s"/>
      </rect>
      <circle cx="315" cy="126" r="8" fill="#3b82f6">
        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <text x="331" y="131" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">IBM Granite</text>
    </g>

    <!-- ═══════════════ ROW 3: NAVIGATOR HARDWARE (y=156, pills y=164) ═══════════════ -->
    <text x="12" y="156" fill="#ec4899" font-family="'Courier New', monospace" font-weight="bold" font-size="11" letter-spacing="2" filter="url(#textGlow)">
      🧩 NAVIGATOR HARDWARE (IoT)
    </text>

    <!-- Raspberry Pi (Thousand Sunny Crimson) -->
    <g filter="url(#goldGlow)">
      <rect x="10" y="164" width="148" height="28" rx="14" fill="#20000a" stroke="#ec4899" stroke-width="1.5">
        <animate attributeName="stroke" values="#ec4899;#d90429;#ec4899" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <circle cx="24" cy="178" r="8" fill="#ec4899">
        <animate attributeName="r" values="7;9;7" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="183" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Raspberry Pi</text>
    </g>

    <!-- NVIDIA Jetson (Zoro's Enma Green Haki Flame) -->
    <g filter="url(#hakiGlow)">
      <rect x="166" y="164" width="156" height="28" rx="14" fill="#001808" stroke="#10b981" stroke-width="1.5">
        <animate attributeName="stroke" values="#10b981;#00ff66;#10b981" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <circle cx="180" cy="178" r="8" fill="#10b981">
        <animate attributeName="r" values="7;9.5;7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="196" y="183" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">NVIDIA Jetson</text>
    </g>

    <!-- ═══════════════ ROW 4: ALL BLUE CLOUD (y=208, pills y=216) ═══════════════ -->
    <text x="12" y="208" fill="#06b6d4" font-family="'Courier New', monospace" font-weight="bold" font-size="11" letter-spacing="2" filter="url(#textGlow)">
      🌊 ALL BLUE CLOUD PLATFORMS
    </text>

    <!-- MS Azure -->
    <g filter="url(#goldGlow)">
      <rect x="10" y="216" width="116" height="28" rx="14" fill="#021428" stroke="#06b6d4" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.2s"/>
      </rect>
      <circle cx="24" cy="230" r="8" fill="#06b6d4">
        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <text x="40" y="235" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">MS Azure</text>
    </g>

    <!-- Google Cloud -->
    <g filter="url(#goldGlow)">
      <rect x="134" y="216" width="148" height="28" rx="14" fill="#021428" stroke="#3b82f6" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.6s"/>
      </rect>
      <circle cx="148" cy="230" r="8" fill="#3b82f6">
        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <text x="164" y="235" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Google Cloud</text>
    </g>

    <!-- ═══════════════ ROW 5: HAKI & SECURITY (y=260, pills y=268) ═══════════════ -->
    <text x="12" y="260" fill="#10b981" font-family="'Courier New', monospace" font-weight="bold" font-size="11" letter-spacing="2" filter="url(#textGlow)">
      ⚡ HAKI &amp; CYBER SECURITY
    </text>

    <!-- Data Analytics -->
    <g filter="url(#goldGlow)">
      <rect x="10" y="268" width="160" height="28" rx="14" fill="#1e0018" stroke="#f43f5e" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </rect>
      <circle cx="24" cy="282" r="8" fill="#f43f5e">
        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <text x="40" y="287" fill="#f8fafc" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Data Analytics</text>
    </g>

    <!-- Cybersecurity (Armament Haki Green Glow) -->
    <g filter="url(#hakiGlow)">
      <rect x="178" y="268" width="154" height="28" rx="14" fill="#001c0c" stroke="#00ff66" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="192" cy="282" r="8" fill="#00ff66">
        <animate attributeName="r" values="7;9.5;7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="208" y="287" fill="#00ff88" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Cybersecurity</text>
    </g>

    <!-- ═══════════════ ONE PIECE FOOTER BAR ═══════════════ -->
    <line x1="0" y1="312" x2="850" y2="312" stroke="#ffb703" stroke-width="1"/>
    <text x="425" y="328" text-anchor="middle" fill="#ffb703" font-family="'Courier New', monospace" font-size="10" font-weight="bold" letter-spacing="3" filter="url(#textGlow)">
      ⚓ KING OF THE PIRATES DEV // IEM KOLKATA · B.TECH CSE (AI) · 3RD YEAR ⚓
    </text>

    <!-- ═══════════════ TREASURE MAP CORNER ACCENTS ═══════════════ -->
    <g stroke="#ffb703" stroke-width="2" fill="none" opacity="0.8">
      <path d="M10,24 L10,10 L24,10"/>
      <path d="M840,24 L840,10 L826,10"/>
      <path d="M10,316 L10,330 L24,330"/>
      <path d="M840,316 L840,330 L826,330"/>
    </g>
  </g>
</svg>
