<svg xmlns="http://www.w3.org/2000/svg" width="170" height="50" viewBox="0 0 170 50">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
  </defs>

  <!-- Outer halo glow -->
  <rect x="3" y="3" width="164" height="44" rx="22"
        fill="none" stroke="#e6edf3" stroke-width="5"
        stroke-dasharray="55 313" stroke-linecap="round"
        filter="url(#halo)" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-368" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Dark background -->
  <rect x="3" y="3" width="164" height="44" rx="22" fill="url(#bg)"/>

  <!-- Subtle static border -->
  <rect x="3" y="3" width="164" height="44" rx="22"
        fill="none" stroke="#8b949e" stroke-width="0.6" opacity="0.25"/>

  <!-- Primary animated glow border -->
  <rect x="3" y="3" width="164" height="44" rx="22"
        fill="none" stroke="#e6edf3" stroke-width="2.5"
        stroke-dasharray="50 318" stroke-linecap="round"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-368" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Secondary glow trail -->
  <rect x="3" y="3" width="164" height="44" rx="22"
        fill="none" stroke="#8b949e" stroke-width="1.5"
        stroke-dasharray="25 343" stroke-linecap="round"
        opacity="0.4" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="-184;184" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- GitHub Octocat icon -->
  <g transform="translate(19, 13)">
    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
          fill="white" transform="scale(1)"/>
  </g>

  <!-- Label -->
  <text x="108" y="31" text-anchor="middle" fill="white"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="13" letter-spacing="2.5">GITHUB</text>
</svg>
