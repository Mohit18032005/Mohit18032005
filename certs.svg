    <circle cx="22" cy="212" r="5.5" fill="#86efac" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="1.12s"/>
    </circle>
    <text x="36" y="216" fill="#e2e8f0" font-family="monospace" font-size="12">Data Analytics</text>
    <rect x="490" y="202" width="86" height="18" rx="9" fill="#001a00" stroke="#86efac" stroke-width="0.8"/>
    <text x="533" y="215" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">Deloitte</text>
    <text x="700" y="216" fill="#4a3570" font-family="monospace" font-size="11">Oct–Nov 2025</text>

    <line x1="20" y1="228" x2="830" y2="228" stroke="#12103a" stroke-width="0.6"/>

