<svg width="850" height="410" viewBox="0 0 850 410" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Konoha Night -->
    <linearGradient id="ninjaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0514"/>
      <stop offset="45%"  stop-color="#140924"/>
      <stop offset="85%"  stop-color="#1c0b1a"/>
      <stop offset="100%" stop-color="#08030f"/>
    </linearGradient>

    <!-- Nine-Tails & Rasengan Chakra Progress Bar Gradient -->
    <linearGradient id="chakraBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff6700"/>
      <stop offset="50%"  stop-color="#ff003c"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Soft Chakra Shadow -->
    <filter id="chakraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff6700" flood-opacity="0.4"/>
    </filter>

    <!-- Rasengan Glow -->
    <filter id="blueChakraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>

    <!-- Clip -->
    <clipPath id="certClip"><rect width="850" height="410" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#certClip)">
    <!-- Background -->
    <rect width="850" height="410" fill="url(#ninjaBg)"/>

    <!-- === DRIFTING KONOHA LEAVES & CHAKRA PARTICLES === -->
    <!-- Leaf 1 (Konoha Green Leaf) -->
    <g fill="#4eab65" opacity="0.6">
      <path d="M0,0 C4,-8 12,-6 10,2 C8,8 0,10 0,0 Z">
        <animateTransform attributeName="transform" type="translate" values="80,-10; 140,420" dur="9s" repeatCount="indefinite" begin="0s"/>
        <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="9s" repeatCount="indefinite" additive="sum"/>
      </path>
      <!-- Leaf 2 -->
      <path d="M0,0 C4,-8 12,-6 10,2 C8,8 0,10 0,0 Z">
        <animateTransform attributeName="transform" type="translate" values="320,-10; 380,420" dur="11s" repeatCount="indefinite" begin="2s"/>
        <animateTransform attributeName="transform" type="rotate" values="45; 405" dur="11s" repeatCount="indefinite" additive="sum"/>
      </path>
      <!-- Leaf 3 -->
      <path d="M0,0 C4,-8 12,-6 10,2 C8,8 0,10 0,0 Z">
        <animateTransform attributeName="transform" type="translate" values="600,-10; 660,420" dur="10s" repeatCount="indefinite" begin="4s"/>
        <animateTransform attributeName="transform" type="rotate" values="90; 450" dur="10s" repeatCount="indefinite" additive="sum"/>
      </path>
      <!-- Leaf 4 -->
      <path d="M0,0 C4,-8 12,-6 10,2 C8,8 0,10 0,0 Z">
        <animateTransform attributeName="transform" type="translate" values="780,-10; 810,420" dur="8s" repeatCount="indefinite" begin="1s"/>
        <animateTransform attributeName="transform" type="rotate" values="120; 480" dur="8s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>

