      <circle cx="100" cy="420" r="3" fill="#ff6700" opacity="0.4">
        <animate attributeName="cy" values="420;10" dur="7s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="420" r="2" fill="#00f0ff" opacity="0.5">
        <animate attributeName="cy" values="420;20" dur="6s" repeatCount="indefinite" begin="2s"/>
