    <line x1="20" y1="96" x2="830" y2="96" stroke="#12103a" stroke-width="0.6"/>

    <!-- ═════ ROW 2: AI on Microsoft Azure — Microsoft ═════ -->
    <circle cx="22" cy="113" r="5.5" fill="#00A4EF" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0.28s"/>
    </circle>
    <text x="36" y="117" fill="#e2e8f0" font-family="monospace" font-size="12">AI on Microsoft Azure</text>
    <rect x="490" y="103" width="104" height="18" rx="9" fill="#00060f" stroke="#00A4EF" stroke-width="0.8"/>
    <text x="542" y="116" text-anchor="middle" fill="#00A4EF" font-family="monospace" font-size="10">Microsoft</text>
    <text x="700" y="117" fill="#4a3570" font-family="monospace" font-size="11">Jul 2025</text>

    <line x1="20" y1="129" x2="830" y2="129" stroke="#12103a" stroke-width="0.6"/>

    <!-- ═════ ROW 3: Ignite India — Wadhwani Foundation ═════ -->
    <circle cx="22" cy="146" r="5.5" fill="#22c55e" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0.56s"/>
    </circle>
    <text x="36" y="150" fill="#e2e8f0" font-family="monospace" font-size="12">Ignite India (Entrepreneurship)</text>
    <rect x="490" y="136" width="140" height="18" rx="9" fill="#001a00" stroke="#22c55e" stroke-width="0.8"/>
    <text x="560" y="149" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="10">Wadhwani Fdn</text>
    <text x="700" y="150" fill="#4a3570" font-family="monospace" font-size="11">Oct 2025</text>

    <line x1="20" y1="162" x2="830" y2="162" stroke="#12103a" stroke-width="0.6"/>

