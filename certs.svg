    <circle cx="22" cy="278" r="5.5" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1.68s"/>
    </circle>
    <text x="36" y="282" fill="#e2e8f0" font-family="monospace" font-size="12">Cyber Job Simulation</text>
    <rect x="490" y="268" width="86" height="18" rx="9" fill="#001a00" stroke="#86efac" stroke-width="0.8"/>
    <text x="533" y="281" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">Deloitte</text>
    <text x="700" y="282" fill="#4a3570" font-family="monospace" font-size="11">Jan 2026</text>

    <line x1="20" y1="294" x2="830" y2="294" stroke="#12103a" stroke-width="0.6"/>

