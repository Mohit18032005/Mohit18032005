<svg width="850" height="400" viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="progBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="850" height="400"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="850" height="400" fill="#080b10"/>

    <!-- Dot grid -->
    <g fill="#a855f7" opacity="0.025">
      <circle cx="80" cy="80" r="1.2"/><circle cx="170" cy="80" r="1.2"/><circle cx="260" cy="80" r="1.2"/><circle cx="350" cy="80" r="1.2"/><circle cx="440" cy="80" r="1.2"/><circle cx="530" cy="80" r="1.2"/><circle cx="620" cy="80" r="1.2"/><circle cx="710" cy="80" r="1.2"/><circle cx="800" cy="80" r="1.2"/>
      <circle cx="80" cy="160" r="1.2"/><circle cx="170" cy="160" r="1.2"/><circle cx="260" cy="160" r="1.2"/><circle cx="350" cy="160" r="1.2"/><circle cx="440" cy="160" r="1.2"/><circle cx="530" cy="160" r="1.2"/><circle cx="620" cy="160" r="1.2"/><circle cx="710" cy="160" r="1.2"/><circle cx="800" cy="160" r="1.2"/>
      <circle cx="80" cy="240" r="1.2"/><circle cx="170" cy="240" r="1.2"/><circle cx="260" cy="240" r="1.2"/><circle cx="350" cy="240" r="1.2"/><circle cx="440" cy="240" r="1.2"/><circle cx="530" cy="240" r="1.2"/><circle cx="620" cy="240" r="1.2"/><circle cx="710" cy="240" r="1.2"/><circle cx="800" cy="240" r="1.2"/>
      <circle cx="80" cy="320" r="1.2"/><circle cx="170" cy="320" r="1.2"/><circle cx="260" cy="320" r="1.2"/><circle cx="350" cy="320" r="1.2"/><circle cx="440" cy="320" r="1.2"/><circle cx="530" cy="320" r="1.2"/><circle cx="620" cy="320" r="1.2"/><circle cx="710" cy="320" r="1.2"/><circle cx="800" cy="320" r="1.2"/>
    </g>

    <!-- Header bar -->
    <rect width="850" height="36" fill="#0d0f17"/>
    <circle cx="18" cy="18" r="6" fill="#ff5f57" opacity="0.85"/>
    <circle cx="36" cy="18" r="6" fill="#febc2e" opacity="0.85"/>
    <circle cx="54" cy="18" r="6" fill="#28c840" opacity="0.85"/>
    <text x="72" y="23" fill="#a855f7" font-family="monospace" font-size="12" letter-spacing="2">$ cat certifications.md</text>
    <text x="720" y="23" fill="#2d1b50" font-family="monospace" font-size="11">9 / 9  CERTIFIED</text>
    <line x1="0" y1="36" x2="850" y2="36" stroke="#1a1040" stroke-width="1"/>

    <!-- Progress bar -->
    <rect x="20" y="48" width="810" height="10" rx="5" fill="#0f0920"/>
    <rect x="20" y="48" width="810" height="10" rx="5" fill="url(#progBg)">
      <animate attributeName="width" from="0" to="810" dur="1.5s" fill="freeze" begin="0.3s"/>
    </rect>
    <text x="425" y="57" text-anchor="middle" fill="white" font-family="monospace" font-size="7" letter-spacing="1">9 / 9  CERTIFICATIONS  EARNED</text>

    <!-- ═════ ROW 1: Generative AI — IBM ═════ -->
    <circle cx="22" cy="80" r="5.5" fill="#4589ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <text x="36" y="84" fill="#e2e8f0" font-family="monospace" font-size="12">Generative AI</text>
    <rect x="490" y="70" width="72" height="18" rx="9" fill="#000d2a" stroke="#4589ff" stroke-width="0.8"/>
    <text x="526" y="83" text-anchor="middle" fill="#4589ff" font-family="monospace" font-size="10">IBM</text>
    <text x="700" y="84" fill="#4a3570" font-family="monospace" font-size="11">Mar 2025</text>

