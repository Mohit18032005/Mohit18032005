    <circle cx="22" cy="311" r="5.5" fill="#4589ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="1.96s"/>
    </circle>
    <text x="36" y="315" fill="#e2e8f0" font-family="monospace" font-size="12">IBM Granite Models for Software Dev</text>
    <rect x="490" y="301" width="72" height="18" rx="9" fill="#000d2a" stroke="#4589ff" stroke-width="0.8"/>
    <text x="526" y="314" text-anchor="middle" fill="#4589ff" font-family="monospace" font-size="10">IBM</text>
    <text x="700" y="315" fill="#4a3570" font-family="monospace" font-size="11">Mar 2026</text>

    <line x1="20" y1="327" x2="830" y2="327" stroke="#12103a" stroke-width="0.6"/>

    <!-- ═════ ROW 9: AI Internship — Codec Technologies ═════ -->
    <circle cx="22" cy="344" r="5.5" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="2.24s"/>
    </circle>
    <text x="36" y="348" fill="#e2e8f0" font-family="monospace" font-size="12">AI Internship</text>
    <rect x="490" y="334" width="126" height="18" rx="9" fill="#100020" stroke="#a855f7" stroke-width="0.8"/>
    <text x="553" y="347" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="10">Codec Technologies</text>
    <text x="700" y="348" fill="#4a3570" font-family="monospace" font-size="11">May–Jun 2026</text>

    <!-- ═════ FOOTER ═════ -->
    <line x1="0" y1="364" x2="850" y2="364" stroke="#1a1040" stroke-width="1"/>
    <text x="425" y="382" text-anchor="middle" fill="#2d1b50" font-family="monospace" font-size="11" letter-spacing="2">9 CERTS  ·  2 ROBOTS BUILT  ·  1 INTERNSHIP  ·  STILL SHIPPING</text>

    <!-- Pulsing checkmarks after footer text -->
    <circle cx="790" cy="379" r="3" fill="#a855f7" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Scanning line -->
    <rect x="0" y="36" width="850" height="1.5" fill="url(#scan)">
      <animate attributeName="y"       values="36;363;36"    dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- Corner brackets -->
    <g stroke="#a855f7" stroke-width="1.5" fill="none">
      <path d="M8,20 L8,8 L20,8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="0s"/></path>
      <path d="M842,20 L842,8 L830,8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="1s"/></path>
      <path d="M8,382 L8,394 L20,394"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="1.5s"/></path>
      <path d="M842,382 L842,394 L830,394"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="0.5s"/></path>
    </g>

    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="849" height="399" fill="none" stroke="#a855f7" stroke-width="0.8">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
