    <circle cx="22" cy="245" r="5.5" fill="#4285F4" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
    <text x="36" y="249" fill="#e2e8f0" font-family="monospace" font-size="12">Foundations of Data</text>
    <rect x="490" y="235" width="80" height="18" rx="9" fill="#000a1a" stroke="#4285F4" stroke-width="0.8"/>
    <text x="530" y="248" text-anchor="middle" fill="#4285F4" font-family="monospace" font-size="10">Google</text>
    <text x="700" y="249" fill="#4a3570" font-family="monospace" font-size="11">Dec 2025</text>

    <line x1="20" y1="261" x2="830" y2="261" stroke="#12103a" stroke-width="0.6"/>

