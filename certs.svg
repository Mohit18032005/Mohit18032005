    <circle cx="22" cy="179" r="5.5" fill="#f97316" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0.84s"/>
    </circle>
    <text x="36" y="183" fill="#e2e8f0" font-family="monospace" font-size="12">Hands-on IoT: RPi &amp; NVIDIA Jetson</text>
    <rect x="490" y="169" width="112" height="18" rx="9" fill="#1a0700" stroke="#f97316" stroke-width="0.8"/>
    <text x="546" y="182" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="10">UEM Kolkata</text>
    <text x="700" y="183" fill="#4a3570" font-family="monospace" font-size="11">Sep 2025</text>

