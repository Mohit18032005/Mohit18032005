<svg width="850" height="348" viewBox="0 0 850 348" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c1bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF6B6B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="c2bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="clip"><rect width="850" height="348"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="850" height="348" fill="#080b10"/>

    <!-- Dot grid bg -->
    <g fill="#a855f7" opacity="0.025">
      <circle cx="80"  cy="40"  r="1.5"/><circle cx="170" cy="40"  r="1.5"/><circle cx="260" cy="40"  r="1.5"/><circle cx="350" cy="40"  r="1.5"/><circle cx="440" cy="40"  r="1.5"/><circle cx="530" cy="40"  r="1.5"/><circle cx="620" cy="40"  r="1.5"/><circle cx="710" cy="40"  r="1.5"/><circle cx="800" cy="40"  r="1.5"/>
      <circle cx="80"  cy="130" r="1.5"/><circle cx="170" cy="130" r="1.5"/><circle cx="260" cy="130" r="1.5"/><circle cx="350" cy="130" r="1.5"/><circle cx="440" cy="130" r="1.5"/><circle cx="530" cy="130" r="1.5"/><circle cx="620" cy="130" r="1.5"/><circle cx="710" cy="130" r="1.5"/><circle cx="800" cy="130" r="1.5"/>
      <circle cx="80"  cy="218" r="1.5"/><circle cx="170" cy="218" r="1.5"/><circle cx="260" cy="218" r="1.5"/><circle cx="350" cy="218" r="1.5"/><circle cx="440" cy="218" r="1.5"/><circle cx="530" cy="218" r="1.5"/><circle cx="620" cy="218" r="1.5"/><circle cx="710" cy="218" r="1.5"/><circle cx="800" cy="218" r="1.5"/>
      <circle cx="80"  cy="308" r="1.5"/><circle cx="170" cy="308" r="1.5"/><circle cx="260" cy="308" r="1.5"/><circle cx="350" cy="308" r="1.5"/><circle cx="440" cy="308" r="1.5"/><circle cx="530" cy="308" r="1.5"/><circle cx="620" cy="308" r="1.5"/><circle cx="710" cy="308" r="1.5"/><circle cx="800" cy="308" r="1.5"/>
    </g>

    <!-- ════════════ CARD 1: RADAR OBJECT DETECTION ════════════ -->

    <!-- Card border — RED glow pulse -->
    <rect x="4" y="6" width="842" height="155" rx="12" fill="#080b10" stroke="#FF6B6B" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" begin="0s"/>
    </rect>

    <!-- Left accent bar (red) -->
    <rect x="4" y="6" width="5" height="155" rx="3" fill="url(#c1bar)" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" begin="0s"/>
    </rect>

    <!-- Status dot (pulsing, top-left inside card) -->
    <circle cx="22" cy="24" r="4.5" fill="#FF6B6B" filter="url(#glow)">
      <animate attributeName="r"       values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.6;1;0.6"   dur="2s" repeatCount="indefinite" begin="0s"/>
    </circle>

    <!-- Project number -->
    <text x="32" y="28" fill="#FF6B6B" font-family="monospace" font-size="11" opacity="0.7" font-weight="bold">01</text>

    <!-- Tag: IoT top-right -->
    <rect x="790" y="12" width="48" height="20" rx="10" fill="#FF6B6B" opacity="0.15"/>
    <rect x="790" y="12" width="48" height="20" rx="10" fill="none" stroke="#FF6B6B" stroke-width="0.8" opacity="0.5"/>
    <text x="814" y="26" text-anchor="middle" fill="#FF6B6B" font-family="monospace" font-size="10">IoT</text>

    <!-- Project Title -->
    <text x="50" y="29" fill="#FF6B6B" font-family="monospace" font-size="14.5" font-weight="bold" filter="url(#tg)">Radar-Based Object Detection System</text>

    <!-- Title underline -->
    <line x1="20" y1="38" x2="836" y2="38" stroke="#FF6B6B" stroke-width="0.6" opacity="0.3"/>

    <!-- Features -->
    <text x="20" y="56"  fill="#94a3b8" font-family="monospace" font-size="11">→  Raspberry Pi + ultrasonic sensor on rotating servo — 180° live scanning</text>
    <text x="20" y="72"  fill="#94a3b8" font-family="monospace" font-size="11">→  Python capturing real-time distance + angle data per sweep</text>
    <text x="20" y="88"  fill="#94a3b8" font-family="monospace" font-size="11">→  Live radar-style terminal/GUI visualization on screen</text>
    <text x="20" y="104" fill="#94a3b8" font-family="monospace" font-size="11">→  Skills: embedded systems · sensor interfacing · real-time processing</text>

    <!-- Stack pills — Card 1 -->
    <!-- Raspberry Pi -->
    <rect x="20"  y="118" width="100" height="20" rx="10" fill="#0a000f" stroke="#C51A4A" stroke-width="0.8" opacity="0.9"/>
    <circle cx="31" cy="128" r="5" fill="#C51A4A"/>
    <text x="40" y="132" fill="#e2e8f0" font-family="monospace" font-size="10">Raspberry Pi</text>

    <!-- Python -->
    <rect x="128" y="118" width="68" height="20" rx="10" fill="#0a000f" stroke="#3776AB" stroke-width="0.8"/>
    <circle cx="139" cy="128" r="5" fill="#3776AB"/>
    <text x="148" y="132" fill="#e2e8f0" font-family="monospace" font-size="10">Python</text>

    <!-- Ultrasonic -->
    <rect x="204" y="118" width="90" height="20" rx="10" fill="#0a000f" stroke="#64748b" stroke-width="0.8"/>
    <circle cx="215" cy="128" r="5" fill="#64748b"/>
    <text x="224" y="132" fill="#e2e8f0" font-family="monospace" font-size="10">Ultrasonic</text>

    <!-- Servo Motor -->
    <rect x="302" y="118" width="98" height="20" rx="10" fill="#0a000f" stroke="#64748b" stroke-width="0.8"/>
    <circle cx="313" cy="128" r="5" fill="#94a3b8"/>
    <text x="322" y="132" fill="#e2e8f0" font-family="monospace" font-size="10">Servo Motor</text>

    <!-- GPIO -->
    <rect x="408" y="118" width="52" height="20" rx="10" fill="#0a000f" stroke="#22c55e" stroke-width="0.8"/>
    <circle cx="419" cy="128" r="5" fill="#22c55e"/>
    <text x="428" y="132" fill="#e2e8f0" font-family="monospace" font-size="10">GPIO</text>

    <!-- ════════════ SEPARATOR ════════════ -->
    <g transform="translate(425, 174)" filter="url(#glow)">
      <circle cx="0" cy="0" r="3" fill="#a855f7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <line x1="30"  y1="174" x2="415" y2="174" stroke="#1a1040" stroke-width="0.8"/>
    <line x1="435" y1="174" x2="820" y2="174" stroke="#1a1040" stroke-width="0.8"/>

    <!-- ════════════ CARD 2: VOICE CONTROLLED AI ROBOT ════════════ -->

    <!-- Card border — PURPLE glow pulse -->
    <rect x="4" y="188" width="842" height="155" rx="12" fill="#080b10" stroke="#A855F7" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" begin="1.75s"/>
    </rect>

    <!-- Left accent bar (purple) -->
    <rect x="4" y="188" width="5" height="155" rx="3" fill="url(#c2bar)" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" begin="1.75s"/>
    </rect>

    <!-- Status dot -->
    <circle cx="22" cy="206" r="4.5" fill="#A855F7" filter="url(#glow)">
      <animate attributeName="r"       values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.6;1;0.6"   dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <!-- Project number -->
    <text x="32" y="210" fill="#A855F7" font-family="monospace" font-size="11" opacity="0.7" font-weight="bold">02</text>

    <!-- Tag: AI top-right -->
    <rect x="790" y="194" width="48" height="20" rx="10" fill="#A855F7" opacity="0.15"/>
    <rect x="790" y="194" width="48" height="20" rx="10" fill="none" stroke="#A855F7" stroke-width="0.8" opacity="0.5"/>
    <text x="814" y="208" text-anchor="middle" fill="#A855F7" font-family="monospace" font-size="10">AI</text>

    <!-- Project Title -->
    <text x="50" y="211" fill="#A855F7" font-family="monospace" font-size="14.5" font-weight="bold" filter="url(#tg)">Voice-Controlled AI Robot</text>

    <!-- Title underline -->
    <line x1="20" y1="220" x2="836" y2="220" stroke="#A855F7" stroke-width="0.6" opacity="0.3"/>

    <!-- Features -->
    <text x="20" y="238" fill="#94a3b8" font-family="monospace" font-size="11">→  Raspberry Pi driven by voice commands — Google + Alexa Speech Recognition</text>
    <text x="20" y="254" fill="#94a3b8" font-family="monospace" font-size="11">→  Voice → NLP → GPIO motor control pipeline in real-time</text>
    <text x="20" y="270" fill="#94a3b8" font-family="monospace" font-size="11">→  Supports: forward · backward · left · right navigation commands</text>
    <text x="20" y="286" fill="#94a3b8" font-family="monospace" font-size="11">→  Real-world human-robot interaction using AI and speech processing</text>

    <!-- Stack pills — Card 2 -->
    <!-- Raspberry Pi -->
    <rect x="20"  y="300" width="100" height="20" rx="10" fill="#0a000f" stroke="#C51A4A" stroke-width="0.8"/>
    <circle cx="31" cy="310" r="5" fill="#C51A4A"/>
    <text x="40" y="314" fill="#e2e8f0" font-family="monospace" font-size="10">Raspberry Pi</text>

    <!-- Python -->
    <rect x="128" y="300" width="68" height="20" rx="10" fill="#0a000f" stroke="#3776AB" stroke-width="0.8"/>
    <circle cx="139" cy="310" r="5" fill="#3776AB"/>
    <text x="148" y="314" fill="#e2e8f0" font-family="monospace" font-size="10">Python</text>

    <!-- Voice API -->
    <rect x="204" y="300" width="88" height="20" rx="10" fill="#0a000f" stroke="#4285F4" stroke-width="0.8"/>
    <circle cx="215" cy="310" r="5" fill="#4285F4"/>
    <text x="224" y="314" fill="#e2e8f0" font-family="monospace" font-size="10">G. Voice API</text>

    <!-- Alexa API -->
    <rect x="300" y="300" width="84" height="20" rx="10" fill="#0a000f" stroke="#00caff" stroke-width="0.8"/>
    <circle cx="311" cy="310" r="5" fill="#00caff"/>
    <text x="320" y="314" fill="#e2e8f0" font-family="monospace" font-size="10">Alexa API</text>

    <!-- GPIO -->
    <rect x="392" y="300" width="52" height="20" rx="10" fill="#0a000f" stroke="#22c55e" stroke-width="0.8"/>
    <circle cx="403" cy="310" r="5" fill="#22c55e"/>
    <text x="412" y="314" fill="#e2e8f0" font-family="monospace" font-size="10">GPIO</text>

    <!-- ════════════ GLOBAL SCAN LINE ════════════ -->
    <rect x="0" y="6" width="850" height="1.5" fill="url(#scan)">
      <animate attributeName="y"       values="6;337;6"     dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.95;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- ════════════ OUTER BORDER PULSE ════════════ -->
    <rect x="0.5" y="0.5" width="849" height="347" fill="none" stroke="#a855f7" stroke-width="0.8">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Corner brackets -->
    <g stroke="#a855f7" stroke-width="1.5" fill="none">
      <path d="M8,18 L8,6 L20,6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="0s"/></path>
      <path d="M842,18 L842,6 L830,6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="1s"/></path>
      <path d="M8,330 L8,342 L20,342"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="1.5s"/></path>
      <path d="M842,330 L842,342 L830,342"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" begin="0.5s"/></path>
    </g>
  </g>
</svg>
