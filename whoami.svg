<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <!-- Parchment-style warm background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#120824"/>
      <stop offset="50%" style="stop-color:#1a0f3a"/>
      <stop offset="100%" style="stop-color:#0f0620"/>
    </linearGradient>

    <!-- Left nature glow -->
    <radialGradient id="leftGlow" cx="0%" cy="50%" r="40%">
      <stop offset="0%"  style="stop-color:#2d6a2a;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#120824;stop-opacity:0"/>
    </radialGradient>

    <!-- Right warm glow -->
    <radialGradient id="rightGlow" cx="100%" cy="50%" r="40%">
      <stop offset="0%"  style="stop-color:#6b21a8;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#120824;stop-opacity:0"/>
    </radialGradient>

    <!-- Firefly glow -->
    <filter id="ffGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Leaf glow -->
    <filter id="leafGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect width="900" height="220" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="900" height="220" fill="url(#cardBg)"/>
    <rect width="900" height="220" fill="url(#leftGlow)"/>
    <rect width="900" height="220" fill="url(#rightGlow)"/>

    <!-- Subtle dot pattern background -->
    <g fill="#ffffff" opacity="0.03">
      <circle cx="50"  cy="30"  r="1"/><circle cx="150" cy="60"  r="1"/>
      <circle cx="250" cy="20"  r="1"/><circle cx="350" cy="50"  r="1"/>
      <circle cx="450" cy="35"  r="1"/><circle cx="550" cy="55"  r="1"/>
      <circle cx="650" cy="25"  r="1"/><circle cx="750" cy="45"  r="1"/>
      <circle cx="850" cy="30"  r="1"/><circle cx="100" cy="180" r="1"/>
      <circle cx="300" cy="195" r="1"/><circle cx="600" cy="190" r="1"/>
      <circle cx="800" cy="185" r="1"/>
    </g>

    <!-- === BORDER FRAME (Ghibli scroll style) === -->
    <!-- Outer border -->
    <rect x="12" y="12" width="876" height="196" rx="10"
          fill="none" stroke="#6b21a8" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Inner border (thinner) -->
    <rect x="18" y="18" width="864" height="184" rx="8"
          fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Corner ornaments -->
    <!-- TL -->
    <path d="M12,30 Q12,12 30,12" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.8" filter="url(#leafGlow)"/>
    <circle cx="12" cy="12" r="3" fill="#a855f7" opacity="0.9" filter="url(#ffGlow)">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- TR -->
    <path d="M888,30 Q888,12 870,12" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.8" filter="url(#leafGlow)"/>
    <circle cx="888" cy="12" r="3" fill="#a855f7" opacity="0.9" filter="url(#ffGlow)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- BL -->
    <path d="M12,190 Q12,208 30,208" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.8" filter="url(#leafGlow)"/>
    <circle cx="12" cy="208" r="3" fill="#a855f7" opacity="0.9" filter="url(#ffGlow)">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <!-- BR -->
    <path d="M888,190 Q888,208 870,208" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.8" filter="url(#leafGlow)"/>
    <circle cx="888" cy="208" r="3" fill="#a855f7" opacity="0.9" filter="url(#ffGlow)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- === FLOATING LEAVES (left side) === -->
    <!-- Leaf 1 -->
    <ellipse cx="0" cy="0" rx="8" ry="4" fill="#4ade80" opacity="0" transform="rotate(-30)" filter="url(#leafGlow)">
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.2;0.7;1" dur="9s" repeatCount="indefinite" begin="0s"/>
      <animateTransform attributeName="transform" type="translate" values="-20,50;40,180;80,230" dur="9s" repeatCount="indefinite" begin="0s" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" values="-30;10;-20" dur="9s" repeatCount="indefinite" begin="0s" additive="sum"/>
    </ellipse>
    <!-- Leaf 2 -->
    <ellipse cx="0" cy="0" rx="7" ry="3.5" fill="#86efac" opacity="0" filter="url(#leafGlow)">
      <animate attributeName="opacity" values="0;0;0.5;0.5;0" keyTimes="0;0.15;0.35;0.7;1" dur="12s" repeatCount="indefinite" begin="3s"/>
      <animateTransform attributeName="transform" type="translate" values="-10,40;50,190;100,240" dur="12s" repeatCount="indefinite" begin="3s" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" values="20;-15;30" dur="12s" repeatCount="indefinite" begin="3s" additive="sum"/>
    </ellipse>
    <!-- Leaf 3 -->
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="#4ade80" opacity="0" filter="url(#leafGlow)">
      <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.25;0.65;1" dur="8s" repeatCount="indefinite" begin="6s"/>
      <animateTransform attributeName="transform" type="translate" values="860,30;820,150;780,240" dur="8s" repeatCount="indefinite" begin="6s" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" values="-40;5;-25" dur="8s" repeatCount="indefinite" begin="6s" additive="sum"/>
    </ellipse>

    <!-- === FIREFLIES === -->
    <circle r="2" fill="#c8ff80" opacity="0" filter="url(#ffGlow)">
      <animate attributeName="cx" values="50;58;45;55;50" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;68;75;85;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.2;0.5;0.7;1" dur="5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="1.5" fill="#d4ff90" opacity="0" filter="url(#ffGlow)">
      <animate attributeName="cx" values="840;850;835;845;840" dur="6s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="cy" values="140;128;135;145;140" dur="6s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0;0;0.7;0.7;0" keyTimes="0;0.2;0.4;0.7;1" dur="6s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle r="2" fill="#bbff55" opacity="0" filter="url(#ffGlow)">
      <animate attributeName="cx" values="60;70;55;65;60" dur="7s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="cy" values="160;148;155;165;160" dur="7s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0;0" keyTimes="0;0.25;0.55;0.75;1" dur="7s" repeatCount="indefinite" begin="4s"/>
    </circle>
    <circle r="1.5" fill="#c0ff70" opacity="0" filter="url(#ffGlow)">
      <animate attributeName="cx" values="860;870;852;862;860" dur="5.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="cy" values="70;58;65;75;70" dur="5.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.75;0.75;0;0" keyTimes="0;0.2;0.5;0.7;1" dur="5.5s" repeatCount="indefinite" begin="1s"/>
    </circle>

    <!-- === DECORATIVE VINES / BRANCH (left) === -->
    <path d="M30,208 Q35,190 28,170 Q22,150 32,130 Q40,115 30,95"
          stroke="#2d6a2a" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#leafGlow)">
      <animate attributeName="opacity" values="0.5;0.3;0.5" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- Tiny leaves on vine -->
    <ellipse cx="32" cy="130" rx="6" ry="3" fill="#4ade80" opacity="0.45" transform="rotate(-20,32,130)" filter="url(#leafGlow)"/>
    <ellipse cx="28" cy="155" rx="5" ry="2.5" fill="#86efac" opacity="0.4" transform="rotate(25,28,155)" filter="url(#leafGlow)"/>
    <ellipse cx="30" cy="105" rx="5" ry="2.5" fill="#4ade80" opacity="0.4" transform="rotate(-35,30,105)" filter="url(#leafGlow)"/>

    <!-- Right vine -->
    <path d="M870,12 Q865,35 872,55 Q878,75 868,95 Q860,112 870,135"
          stroke="#2d6a2a" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#leafGlow)">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="868" cy="95" rx="6" ry="3" fill="#4ade80" opacity="0.45" transform="rotate(20,868,95)" filter="url(#leafGlow)"/>
    <ellipse cx="872" cy="60" rx="5" ry="2.5" fill="#86efac" opacity="0.4" transform="rotate(-25,872,60)" filter="url(#leafGlow)"/>

    <!-- === SECTION LABEL === -->
    <text x="60" y="48" font-family="Georgia, serif" font-size="11" fill="#a855f7" opacity="0.8" letter-spacing="3">✦  IDENTITY SCROLL  ✦</text>

    <!-- Horizontal divider under label -->
    <line x1="60" y1="56" x2="840" y2="56" stroke="#6b21a8" stroke-width="0.8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- === INFO ROWS === -->
    <!-- Row 1: Name -->
    <text x="80" y="90" font-family="'Courier New', monospace" font-size="14" fill="#c084fc" opacity="0.9">Name</text>
    <text x="160" y="90" font-family="'Courier New', monospace" font-size="14" fill="#6b21a8" opacity="0.7">→</text>
    <text x="185" y="90" font-family="'Courier New', monospace" font-size="14" fill="#fff8e1" font-weight="bold">MD Mohit Khan</text>

    <!-- Row 2: Degree -->
    <text x="80" y="115" font-family="'Courier New', monospace" font-size="14" fill="#c084fc" opacity="0.9">Degree</text>
    <text x="160" y="115" font-family="'Courier New', monospace" font-size="14" fill="#6b21a8" opacity="0.7">→</text>
    <text x="185" y="115" font-family="'Courier New', monospace" font-size="14" fill="#e9d5ff">B.Tech CSE (AI) · 3rd Year · IEM Kolkata</text>

    <!-- Row 3: Focus -->
    <text x="80" y="140" font-family="'Courier New', monospace" font-size="14" fill="#c084fc" opacity="0.9">Focus</text>
    <text x="160" y="140" font-family="'Courier New', monospace" font-size="14" fill="#6b21a8" opacity="0.7">→</text>
    <text x="185" y="140" font-family="'Courier New', monospace" font-size="14" fill="#e9d5ff">AI / ML / IoT / Cybersecurity</text>

    <!-- Row 4: Base -->
    <text x="80" y="165" font-family="'Courier New', monospace" font-size="14" fill="#c084fc" opacity="0.9">Base</text>
    <text x="160" y="165" font-family="'Courier New', monospace" font-size="14" fill="#6b21a8" opacity="0.7">→</text>
    <text x="185" y="165" font-family="'Courier New', monospace" font-size="14" fill="#e9d5ff">Kolkata, West Bengal 🇮🇳</text>

    <!-- Row 5: Status -->
    <text x="80" y="190" font-family="'Courier New', monospace" font-size="14" fill="#c084fc" opacity="0.9">Status</text>
    <text x="160" y="190" font-family="'Courier New', monospace" font-size="14" fill="#6b21a8" opacity="0.7">→</text>
    <!-- Animated status text -->
    <text x="185" y="190" font-family="'Courier New', monospace" font-size="14" fill="#4ade80">Building · Learning · Shipping
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <!-- Status pulsing dot -->
    <circle cx="170" cy="185" r="4" fill="#4ade80" filter="url(#ffGlow)">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- === BOTTOM DECORATIVE LINE === -->
    <line x1="60" y1="202" x2="840" y2="202" stroke="#6b21a8" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- Scan shimmer effect -->
    <rect x="18" y="18" width="864" height="4" fill="white" opacity="0" rx="2">
      <animate attributeName="y" values="18;196" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.04;0.04;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
