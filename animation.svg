<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0015"/>
      <stop offset="50%" style="stop-color:#0d0028"/>
      <stop offset="100%" style="stop-color:#0a0015"/>
    </linearGradient>
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" fill="url(#bgGrad)" rx="12"/>

  <!-- Matrix rain left -->
  <text x="22" y="0" font-family="Courier New" font-size="11" fill="#a855f7" opacity="0.5">
    <tspan x="22" dy="0">0</tspan><tspan x="22" dy="14">1</tspan><tspan x="22" dy="14">A</tspan>
    <tspan x="22" dy="14">0</tspan><tspan x="22" dy="14">F</tspan><tspan x="22" dy="14">1</tspan>
    <tspan x="22" dy="14">0</tspan><tspan x="22" dy="14">E</tspan><tspan x="22" dy="14">1</tspan>
    <tspan x="22" dy="14">0</tspan><tspan x="22" dy="14">B</tspan><tspan x="22" dy="14">1</tspan>
    <tspan x="22" dy="14">C</tspan><tspan x="22" dy="14">D</tspan><tspan x="22" dy="14">1</tspan>
    <tspan x="22" dy="14">0</tspan><tspan x="22" dy="14">E</tspan><tspan x="22" dy="14">F</tspan>
    <tspan x="22" dy="14">0</tspan><tspan x="22" dy="14">1</tspan>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-280;0,0" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="40" y="0" font-family="Courier New" font-size="11" fill="#c084fc" opacity="0.35">
    <tspan x="40" dy="0">B</tspan><tspan x="40" dy="14">0</tspan><tspan x="40" dy="14">1</tspan>
    <tspan x="40" dy="14">C</tspan><tspan x="40" dy="14">D</tspan><tspan x="40" dy="14">1</tspan>
    <tspan x="40" dy="14">0</tspan><tspan x="40" dy="14">E</tspan><tspan x="40" dy="14">F</tspan>
    <tspan x="40" dy="14">0</tspan><tspan x="40" dy="14">1</tspan><tspan x="40" dy="14">A</tspan>
    <tspan x="40" dy="14">0</tspan><tspan x="40" dy="14">1</tspan><tspan x="40" dy="14">C</tspan>
    <tspan x="40" dy="14">B</tspan><tspan x="40" dy="14">1</tspan><tspan x="40" dy="14">0</tspan>
    <tspan x="40" dy="14">1</tspan><tspan x="40" dy="14">F</tspan>
    <animateTransform attributeName="transform" type="translate" values="0,-100;0,-380;0,-100" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- Matrix rain right -->
  <text x="860" y="0" font-family="Courier New" font-size="11" fill="#a855f7" opacity="0.5">
    <tspan x="860" dy="0">1</tspan><tspan x="860" dy="14">0</tspan><tspan x="860" dy="14">A</tspan>
    <tspan x="860" dy="14">0</tspan><tspan x="860" dy="14">1</tspan><tspan x="860" dy="14">F</tspan>
    <tspan x="860" dy="14">E</tspan><tspan x="860" dy="14">8</tspan><tspan x="860" dy="14">D</tspan>
    <tspan x="860" dy="14">1</tspan><tspan x="860" dy="14">0</tspan><tspan x="860" dy="14">C</tspan>
    <tspan x="860" dy="14">B</tspan><tspan x="860" dy="14">1</tspan><tspan x="860" dy="14">0</tspan>
    <tspan x="860" dy="14">C</tspan><tspan x="860" dy="14">B</tspan><tspan x="860" dy="14">1</tspan>
    <animateTransform attributeName="transform" type="translate" values="0,-50;0,-330;0,-50" dur="7s" repeatCount="indefinite"/>
  </text>

  <text x="878" y="0" font-family="Courier New" font-size="11" fill="#c084fc" opacity="0.35">
    <tspan x="878" dy="0">S</tspan><tspan x="878" dy="14">5</tspan><tspan x="878" dy="14">0</tspan>
    <tspan x="878" dy="14">E</tspan><tspan x="878" dy="14">9</tspan><tspan x="878" dy="14">1</tspan>
    <tspan x="878" dy="14">0</tspan><tspan x="878" dy="14">B</tspan><tspan x="878" dy="14">1</tspan>
    <tspan x="878" dy="14">0</tspan><tspan x="878" dy="14">0</tspan><tspan x="878" dy="14">1</tspan>
    <tspan x="878" dy="14">C</tspan><tspan x="878" dy="14">B</tspan><tspan x="878" dy="14">1</tspan>
    <animateTransform attributeName="transform" type="translate" values="0,-150;0,-420;0,-150" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- Corner brackets -->
  <path d="M 8,8 L 8,50 M 8,8 L 50,8" stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#purpleGlow)"/>
  <path d="M 892,8 L 892,50 M 892,8 L 850,8" stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#purpleGlow)"/>
  <path d="M 8,272 L 8,230 M 8,272 L 50,272" stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#purpleGlow)"/>
  <path d="M 892,272 L 892,230 M 892,272 L 850,272" stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#purpleGlow)"/>

  <!-- Pulsing corner dots -->
  <circle cx="8" cy="8" r="3" fill="#a855f7" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="892" cy="8" r="3" fill="#a855f7" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="8" cy="272" r="3" fill="#a855f7" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="892" cy="272" r="3" fill="#a855f7" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Left particle network -->
  <circle cx="80" cy="70" r="4" fill="#c084fc" filter="url(#purpleGlow)">
    <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="140" r="6" fill="#a855f7" filter="url(#strongGlow)">
    <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="210" r="4" fill="#c084fc" filter="url(#purpleGlow)">
    <animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <line x1="80" y1="70" x2="140" y2="140" stroke="#a855f7" stroke-width="1" opacity="0.4" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="140" y1="140" x2="80" y2="210" stroke="#a855f7" stroke-width="1" opacity="0.4" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Traveling particle left -->
  <circle r="3" fill="#e879f9" opacity="0.9" filter="url(#strongGlow)">
    <animate attributeName="cx" values="80;140;80;140;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;140;210;140;70" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Right particle network -->
  <circle cx="820" cy="70" r="4" fill="#c084fc" filter="url(#purpleGlow)">
    <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="140" r="7" fill="#a855f7" filter="url(#strongGlow)">
    <animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="210" r="4" fill="#c084fc" filter="url(#purpleGlow)">
    <animate attributeName="r" values="4;6;4" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="820" y1="70" x2="760" y2="140" stroke="#a855f7" stroke-width="1" opacity="0.4" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="760" y1="140" x2="820" y2="210" stroke="#a855f7" stroke-width="1" opacity="0.4" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Traveling particle right -->
  <circle r="3" fill="#e879f9" opacity="0.9" filter="url(#strongGlow)">
    <animate attributeName="cx" values="820;760;820;760;820" dur="4s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="70;140;210;140;70" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- Scan line -->
  <rect x="60" y="0" width="780" height="3" fill="#a855f7" opacity="0" rx="1">
    <animate attributeName="y" values="-5;285" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.15;0.15;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Dashed lines to center -->
  <line x1="140" y1="140" x2="200" y2="140" stroke="#a855f7" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="760" y1="140" x2="700" y2="140" stroke="#a855f7" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Main name glow layer -->
  <text x="450" y="118" font-family="'Courier New', monospace" font-size="52" font-weight="bold"
        text-anchor="middle" fill="#7c3aed" opacity="0.5" filter="url(#strongGlow)">
    MD Mohit Khan
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
  <!-- Main name -->
  <text x="450" y="118" font-family="'Courier New', monospace" font-size="52" font-weight="bold"
        text-anchor="middle" fill="#ffffff" filter="url(#purpleGlow)">
    MD Mohit Khan
    <animate attributeName="fill" values="#ffffff;#e9d5ff;#ffffff" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="152" font-family="'Courier New', monospace" font-size="15" letter-spacing="5"
        text-anchor="middle" fill="#c084fc" opacity="0.9">
    AI · ML · IoT · BUILDER
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="letter-spacing" values="5;7;5" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- College info -->
  <text x="450" y="185" font-family="'Courier New', monospace" font-size="11" letter-spacing="4"
        text-anchor="middle" fill="#7c3aed" opacity="0.8">
    · IEM KOLKATA · B.TECH CSE (AI) · 2ND YEAR ·
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- Blinking cursor -->
  <rect x="626" y="98" width="12" height="28" fill="#a855f7" opacity="1" rx="2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Top decorative dots -->
  <circle cx="380" cy="30" r="2" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="30" r="3" fill="#c084fc" opacity="0.8" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="30" r="2" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <line x1="380" y1="30" x2="450" y2="30" stroke="#a855f7" stroke-width="0.8" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="30" x2="520" y2="30" stroke="#a855f7" stroke-width="0.8" opacity="0.4">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom decorative dots -->
  <circle cx="380" cy="250" r="2" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="250" r="3" fill="#c084fc" opacity="0.8" filter="url(#purpleGlow)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="250" r="2" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <line x1="380" y1="250" x2="450" y2="250" stroke="#a855f7" stroke-width="0.8" opacity="0.4">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="250" x2="520" y2="250" stroke="#a855f7" stroke-width="0.8" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Status online -->
  <circle cx="200" cy="250" r="4" fill="#22c55e">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="212" y="254" font-family="Courier New" font-size="10" fill="#4ade80" opacity="0.8">ONLINE</text>

  <!-- Open to collab -->
  <text x="650" y="254" font-family="Courier New" font-size="10" fill="#a855f7" opacity="0.7">
    [OPEN TO COLLABORATE]
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </text>

</svg>
