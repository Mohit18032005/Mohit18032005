<svg xmlns="http://www.w3.org/2000/svg" width="155" height="50" viewBox="0 0 155 50">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
  </defs>

  <!-- Outer halo glow -->
  <rect x="3" y="3" width="149" height="44" rx="22"
        fill="none" stroke="#ff6b6b" stroke-width="5"
        stroke-dasharray="55 283" stroke-linecap="round"
        filter="url(#halo)">
    <animate attributeName="stroke-dashoffset" values="0;-338" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Dark background -->
  <rect x="3" y="3" width="149" height="44" rx="22" fill="url(#bg)"/>

  <!-- Subtle static border -->
  <rect x="3" y="3" width="149" height="44" rx="22"
        fill="none" stroke="#D14836" stroke-width="0.6" opacity="0.25"/>

  <!-- Primary animated glow border -->
  <rect x="3" y="3" width="149" height="44" rx="22"
        fill="none" stroke="#ff6b6b" stroke-width="2.5"
        stroke-dasharray="50 288" stroke-linecap="round"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-338" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Secondary glow trail -->
  <rect x="3" y="3" width="149" height="44" rx="22"
        fill="none" stroke="#D14836" stroke-width="1.5"
        stroke-dasharray="25 313" stroke-linecap="round"
        opacity="0.4" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="-169;169" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Gmail "M" icon -->
  <g transform="translate(18, 15)">
    <rect width="22" height="18" rx="2.5" fill="#D14836"/>
    <path d="M1,2 L11,11 L21,2" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Label -->
  <text x="100" y="31" text-anchor="middle" fill="white"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="13" letter-spacing="2.5">EMAIL</text>
</svg>
